{c:"7",q:"Why do infants tire quickly when breathing hard?",o:["They rely heavily on the diaphragm and have little reserve","They have extra lung capacity","Their ribs are fully hardened","They breathe through the mouth by choice"],e:"Watch for belly breathing, retractions, and nasal flaring."},

{c:"8",q:"A proper power grip uses:",o:["Palms up, with hands about 10 inches apart","Palms down, hands touching","Fingertips only","One hand only"],e:"Grip the whole handle and keep the load close to your body."},
{c:"8",q:"When possible, you should:",o:["Push rather than pull","Pull rather than push","Reach far in front of your body","Twist while lifting"],e:"Push at a level between your waist and shoulders when you can."},
{c:"8",q:"During a log roll for suspected spinal injury, who directs the move?",o:["The rescuer at the patient’s head","The rescuer at the feet","The patient","Whoever is strongest"],e:"The head rescuer keeps the head in line and counts the move."},
{c:"8",q:"Rapid extrication is indicated when:",o:["The vehicle is unsafe or the patient is unstable and needs immediate care","The patient is stable with minor pain","You have plenty of time","The patient refuses care"],e:"For a stable seated patient, a short immobilization device may be used instead, per protocol."},
{c:"8",q:"A scoop (orthopedic) stretcher:",o:["Splits lengthwise so it can slide under a patient on the ground","Folds into a chair","Is used to carry patients down stairs while seated","Is used only for bariatric patients"],e:"It lets you lift with minimal movement of the patient."},
{c:"8",q:"A basket (Stokes) stretcher is most useful for:",o:["Rough terrain or high-angle rescue","Routine hospital transfers","Seated patients on stairs","Short moves inside a home"],e:"It holds the patient securely during difficult carries."},
{c:"8",q:"An unresponsive patient is breathing adequately and has no suspected trauma. Best position?",o:["Recovery position","Prone","Supine with head flat","Trendelenburg"],e:"Lying on the side helps fluids drain from the mouth and protects the airway."},
{c:"8",q:"A woman in late pregnancy feels dizzy lying on her back. You should:",o:["Position her on her left side","Raise her head and keep her flat","Sit her straight up only","Place her prone"],e:"Lying supine lets the uterus compress the vena cava (supine hypotensive syndrome)."},
{c:"8",q:"A patient with chest pain wants to walk to the ambulance. You should:",o:["Not let them walk; use a stretcher or stair chair","Let them walk to save time","Have them walk if pain is mild","Let them drive behind you"],e:"Exertion increases the heart’s workload."},
{c:"8",q:"When moving a bariatric patient, you should:",o:["Plan ahead, call for enough help, and use equipment rated for the weight","Use the standard team of two","Avoid telling the patient the plan","Lift quickly to get it over with"],e:"Know your stretcher’s weight limit."},

{c:"10",q:"Normal adult resting respiratory rate:",o:["12–20 breaths per minute","8–10 breaths per minute","24–30 breaths per minute","30–40 breaths per minute"],e:"Normal adult resting heart rate is 60–100 beats per minute."},
{c:"10",q:"Normal oxygen saturation in a healthy patient is usually:",o:["95–100%","85–90%","75–85%","100% only"],e:"Many protocols give oxygen when SpO₂ is below about 94%. Treat the patient, not just the number."},
{c:"10",q:"Which can make a pulse oximetry reading falsely normal?",o:["Carbon monoxide poisoning","Normal breathing","Warm hands","A calm patient"],e:"Cold fingers, poor perfusion, movement, and nail polish can also make readings unreliable."},
{c:"10",q:"Capillary refill is most reliable in:",o:["Children younger than about 6","Older adults","Patients in cold weather","Smokers"],e:"Normal refill is under 2 seconds."},
{c:"10",q:"Pale, cool, clammy skin most suggests:",o:["Shock or poor perfusion","Fever","Liver disease","Normal findings"],e:"Bluish skin suggests low oxygen. Yellow skin suggests liver problems. Flushed skin can mean heat exposure or an allergic reaction."},
{c:"10",q:"Pinpoint pupils in an unresponsive patient suggest:",o:["Opioid overdose","Severe hypoxia","Fright","Normal sleep"],e:"Unequal pupils can suggest a head injury or stroke."},
{c:"10",q:"Measuring blood pressure by palpation gives you:",o:["Only the systolic pressure","Only the diastolic pressure","Both systolic and diastolic","The pulse pressure"],e:"Use auscultation with a stethoscope to get both numbers."},
{c:"10",q:"In DCAP-BTLS, “P” stands for:",o:["Punctures/penetrations","Pain","Pulses","Pallor"],e:"Deformities, Contusions, Abrasions, Punctures/penetrations, Burns, Tenderness, Lacerations, Swelling."},
{c:"10",q:"The highest possible Glasgow Coma Scale score is:",o:["15","10","12","20"],e:"Lowest is 3. Eyes are scored 1–4, verbal 1–5, motor 1–6."},
{c:"10",q:"A patient opens their eyes to pain, uses inappropriate words, and localizes pain. GCS?",o:["10","8","12","13"],e:"Eyes to pain = 2, inappropriate words = 3, localizes pain = 5. Total 10."},
{c:"10",q:"A patient who knows who they are, where they are, the date, and what happened is:",o:["Alert and oriented × 4","Alert and oriented × 2","Responsive to verbal only","Unresponsive"],e:"Person, place, time, and event."},
{c:"10",q:"Which is a significant mechanism of injury?",o:["Ejection from a vehicle","A minor fender-bender at walking speed","A twisted ankle on a curb","A paper cut"],e:"Another example: death of another occupant in the same vehicle."},
{c:"10",q:"A trauma patient is talking but has severe bleeding from the leg. What’s the first priority?",o:["Control the bleeding","Open the airway with a jaw-thrust","Take a full set of vitals","Get a SAMPLE history"],e:"A talking patient has an open airway for now. Life-threatening bleeding gets controlled immediately."},
{c:"10",q:"The chief complaint is best recorded:",o:["In the patient’s own words","As your field diagnosis","As the hospital diagnosis","Only if the patient is in pain"],e:"For example: “My chest feels tight.”"},
{c:"10",q:"Why are repeated vital signs more useful than one set?",o:["The trend shows whether the patient is improving or getting worse","One set is never accurate","The hospital won’t take one set","Repeated sets are only for billing"],e:"Trends are what drive transport and treatment decisions."},
{c:"10",q:"Which reassessment step comes first?",o:["Repeat the primary assessment","Recheck the chief complaint only","Check pupils only","Fill out the PCR"],e:"Then recheck vitals, the complaint, and the effect of your interventions."},
{c:"10",q:"Which patient is a high transport priority?",o:["Chest pain with a systolic BP under 100","An alert patient with a sprained wrist","A stable patient with a minor cut","A patient with a mild cold"],e:"Others: difficulty breathing, uncontrolled bleeding, altered mental status, poor general impression."},
{c:"10",q:"Breath sounds are best compared:",o:["Side to side, at the same level on each side","Only on the right side","Only over the trachea","Only on the back"],e:"Listen at the top and base of each lung, front and back, and compare."},

{c:"11",q:"The most common cause of airway obstruction in an unresponsive patient is:",o:["The tongue","Food","Vomit","Dentures"],e:"Muscle relaxation lets the tongue fall back. A simple manual maneuver often fixes it."},
{c:"11",q:"Deep, rapid breathing in a patient with diabetic ketoacidosis is called:",o:["Kussmaul respirations","Cheyne-Stokes respirations","Agonal respirations","Ataxic respirations"],e:"The body is trying to blow off acid as carbon dioxide."},
{c:"11",q:"A cycle of breaths that grow deeper, then shallower, followed by apnea is:",o:["Cheyne-Stokes respirations","Kussmaul respirations","Normal breathing","Wheezing"],e:"Often seen with stroke or head injury."},
{c:"11",q:"Agonal respirations:",o:["Are occasional gasps that don’t provide adequate breathing","Are a normal pattern during sleep","Mean the patient is breathing well","Require only a nasal cannula"],e:"Treat agonal breathing as inadequate. In an unresponsive patient without a pulse, start CPR."},
{c:"11",q:"Which is a sign of inadequate breathing?",o:["Retractions and use of accessory muscles","Equal chest rise","Normal skin color","Rate of 16 with easy effort"],e:"Others: nasal flaring, tripod position, cyanosis, altered mental status."},
{c:"11",q:"A full oxygen cylinder is pressurized to about:",o:["2,000 psi","200 psi","500 psi","10,000 psi"],e:"Pressure drops as you use it, so check before each call."},
{c:"11",q:"The pin-indexing safety system:",o:["Prevents attaching the wrong regulator to a gas cylinder","Measures flow rate","Humidifies oxygen","Locks the stretcher"],e:"It ensures an oxygen regulator only fits an oxygen cylinder."},
{c:"11",q:"A nonrebreather mask is typically run at:",o:["10–15 L/min","1–6 L/min","25–30 L/min","Any rate"],e:"Inflate the reservoir bag before placing it on the patient. Nasal cannula runs at 1–6 L/min."},
{c:"11",q:"Ventilating with too much volume or force can cause:",o:["Gastric distention and vomiting","Better oxygenation","Improved cardiac output","Faster recovery"],e:"Give each breath over about 1 second, just enough for visible chest rise."},
{c:"11",q:"The “E-C clamp” technique is used to:",o:["Seal a mask to the face during BVM ventilation","Insert an OPA","Measure an NPA","Hold a suction catheter"],e:"Thumb and index finger form the C on the mask; the other fingers form the E along the jaw. Two-person BVM gives a better seal."},
{c:"11",q:"Which is a contraindication to CPAP?",o:["The patient can’t follow commands or protect their airway","Alert patient with pulmonary edema","Moderate respiratory distress","SpO₂ of 90%"],e:"Others: hypotension, suspected pneumothorax, vomiting, facial trauma. Follow your protocol."},
{c:"11",q:"How do you ventilate a patient who breathes through a stoma?",o:["Seal a BVM (infant or child mask) over the stoma","Seal the mask over the mouth and nose only","Insert an OPA","Use a nasal cannula in the stoma"],e:"If air escapes from the mouth and nose, you may need to seal them."},
{c:"11",q:"A rigid (tonsil-tip/Yankauer) catheter is best for suctioning:",o:["The mouth and oropharynx","The nose","A stoma","An infant’s nose"],e:"Soft (French) catheters are used for the nose, stomas, and places a rigid tip can’t reach."},
{c:"11",q:"Maximum suction time for an infant:",o:["5 seconds","10 seconds","15 seconds","30 seconds"],e:"Adults 15 seconds, children 10 seconds, infants 5 seconds."},
{c:"11",q:"How is an NPA sized?",o:["From the tip of the nose to the earlobe","From the corner of the mouth to the earlobe","From the chin to the nose","By the patient’s weight"],e:"Lubricate with a water-soluble lubricant and insert with the bevel toward the septum."},
{c:"11",q:"In an adult, an OPA is usually inserted:",o:["Upside down, then rotated 180 degrees","Sideways, then rotated 45 degrees","Through the nose","Only with a tongue depressor"],e:"In children, use a tongue depressor and insert it right side up to avoid injuring the palate."},
{c:"11",q:"A patient with COPD is in respiratory distress with low SpO₂. Oxygen?",o:["Give oxygen as needed and monitor closely","Never give oxygen to COPD patients","Give oxygen only if unresponsive","Use a BVM regardless of breathing"],e:"Never withhold oxygen from a hypoxic patient out of concern for hypoxic drive."},
{c:"11",q:"A Venturi mask is used to:",o:["Deliver a precise oxygen concentration","Ventilate an apneic patient","Suction the airway","Measure carbon dioxide"],e:"It mixes room air with oxygen in set proportions."},

{c:"12",q:"“Proventil” is a ___ name for albuterol.",o:["Trade","Generic","Chemical","Official"],e:"Generic names (albuterol, nitroglycerin) are standard. Trade names are brand names."},
{c:"12",q:"Which medication do EMTs commonly give from their own supply, per protocol?",o:["Oral glucose","Nitroglycerin","The patient’s albuterol","Insulin"],e:"Oxygen, oral glucose, and aspirin are commonly carried. EMTs typically assist with a patient’s own nitro, inhaler, or epinephrine auto-injector."},
{c:"12",q:"Nitroglycerin is usually given by which route?",o:["Sublingual","Intramuscular","Oral swallowed","Inhalation"],e:"Under the tongue for fast absorption."},
{c:"12",q:"An epinephrine auto-injector is given:",o:["Intramuscularly into the lateral thigh","Under the tongue","Into a vein","By inhalation"],e:"It can go through clothing if needed."},
{c:"12",q:"Oral glucose comes as a:",o:["Gel","Spray","Suspension","Gas"],e:"Activated charcoal is a suspension; oxygen is a gas; nitro can be tablets or spray."},
{c:"12",q:"Which is a contraindication to oral glucose?",o:["The patient can’t swallow or protect their airway","The patient is diabetic","The patient is alert","The patient is hungry"],e:"Giving anything by mouth to a patient who can’t protect their airway risks aspiration."},
{c:"12",q:"Epinephrine helps in anaphylaxis by:",o:["Constricting blood vessels and opening the airways","Slowing the heart","Lowering blood sugar","Thinning the blood"],e:"Side effects include rapid heart rate, anxiety, tremor, and pale skin."},
{c:"12",q:"Albuterol is a:",o:["Bronchodilator","Antiplatelet","Vasodilator","Opioid antagonist"],e:"It relaxes the smooth muscle of the lower airways."},
{c:"12",q:"Aspirin helps in ACS because it:",o:["Reduces platelet clumping and clot growth","Dissolves existing clots completely","Dilates the coronary arteries","Raises blood pressure"],e:"It’s usually chewed. Dose per protocol."},
{c:"12",q:"After naloxone, a patient wakes up suddenly. Be ready for:",o:["Withdrawal symptoms, vomiting, or combativeness","Immediate sleep","A drop in heart rate to 30","Wheezing in every patient"],e:"Naloxone may wear off before the opioid does, so keep monitoring."},
{c:"12",q:"Pharmacokinetics describes:",o:["How the body absorbs, distributes, metabolizes, and eliminates a drug","What a drug does to the body","Drug brand names","Medication rights"],e:"Pharmacodynamics is the reverse: the drug’s effect on the body."},
{c:"12",q:"Steps for helping with a metered-dose inhaler include:",o:["Shake it, have the patient exhale, seal lips, press and inhale deeply, then hold the breath","Spray it into the air first","Have the patient inhale before sealing","Give as many puffs as needed without limits"],e:"A spacer improves delivery. Check that it’s the patient’s own, not expired, and permitted by protocol."},
{c:"12",q:"Before helping a patient take their own medication, you should check:",o:["That it’s prescribed to them, not expired, and allowed by protocol","Only the color of the pill","How much it cost","Nothing if the patient is sure"],e:"Plus the rights: patient, medication, dose, route, time, documentation."},
{c:"12",q:"Activated charcoal works by:",o:["Binding certain toxins in the gut","Neutralizing all poisons in the blood","Causing vomiting","Speeding up absorption"],e:"Contraindicated with altered mental status, inability to swallow, or caustic ingestions."},

{c:"13",q:"The perfusion triangle includes:",o:["Heart (pump), blood vessels (container), and blood (contents)","Lungs, kidneys, and liver","Airway, breathing, and circulation","Brain, spine, and nerves"],e:"Shock results when any side fails."},
{c:"13",q:"Anaphylaxis mainly affects which part of the perfusion triangle?",o:["The blood vessels (container)","The pump","The contents","The lungs only"],e:"Widespread vasodilation makes the container too big for the blood volume."},
{c:"13",q:"After a spinal cord injury, a patient has low BP, warm dry skin, and a normal heart rate. This suggests:",o:["Neurogenic shock","Hypovolemic shock","Cardiogenic shock","Obstructive shock"],e:"Loss of nerve control causes vasodilation. It’s a type of distributive shock."},
{c:"13",q:"Fever, rapid heart rate, low BP, and confusion in a patient with an infection suggest:",o:["Septic shock","Cardiogenic shock","Psychogenic shock","Obstructive shock"],e:"Septic shock is distributive. Early recognition and transport save lives."},
{c:"13",q:"Fainting from a sudden, temporary drop in blood flow to the brain (for example, after bad news) is:",o:["Psychogenic shock","Septic shock","Hypovolemic shock","Cardiogenic shock"],e:"It usually resolves quickly when the patient lies flat, but check for injuries from the fall."},
{c:"13",q:"Beck’s triad (JVD, muffled heart sounds, narrowing pulse pressure) suggests:",o:["Cardiac tamponade","Tension pneumothorax","Hypovolemic shock","Asthma"],e:"Tamponade is a cause of obstructive shock."},
{c:"13",q:"Which finding suggests tension pneumothorax?",o:["Severe dyspnea with absent breath sounds on one side and JVD","Wheezing on both sides","Crackles at both bases","Clear, equal breath sounds"],e:"Tracheal deviation is a late sign. It causes obstructive shock."},
{c:"13",q:"A narrowing pulse pressure in a trauma patient suggests:",o:["Compensation through vasoconstriction","Recovery from shock","Normal findings","Overhydration"],e:"The diastolic pressure rises as vessels constrict, bringing the two numbers closer."},
{c:"13",q:"The three stages of shock, in order:",o:["Compensated, decompensated, irreversible","Mild, moderate, severe","Early, late, recovery","Hypovolemic, cardiogenic, distributive"],e:"In irreversible shock, tissue and organ damage can’t be undone even with treatment."},
{c:"13",q:"Why can shock be hard to spot in an older adult?",o:["Medications like beta blockers may prevent a fast heart rate","Older adults never go into shock","Their blood pressure always rises","Their skin is always warm"],e:"Don’t rely on heart rate alone. Look at mental status, skin, and the whole picture."},
{c:"13",q:"Children in shock often:",o:["Compensate well and then deteriorate very quickly","Show low BP early","Have slow heart rates early","Don’t need rapid transport"],e:"Falling BP is a very late sign in children."},
{c:"13",q:"Why prevent heat loss in a patient in shock?",o:["Hypothermia worsens clotting and shock","It makes the patient sleepy","It lowers blood sugar","It speeds up transport"],e:"Cover the patient and keep the ambulance warm."},
{c:"13",q:"A patient in hemorrhagic shock asks for water. You should:",o:["Not give anything by mouth","Give small sips","Give a sports drink","Give a full glass"],e:"Thirst is a sign of volume loss. The patient may need surgery."},

{c:"14",q:"Where do you place your hands for adult chest compressions?",o:["Center of the chest, on the lower half of the sternum","Over the upper sternum","Over the left ribs","On the xiphoid process"],e:"Avoid compressing the xiphoid process."},
{c:"14",q:"Child compression depth:",o:["At least one-third of the chest depth, about 2 inches","About 1 inch","About 3 inches","Half the chest depth"],e:"Infant: at least one-third, about 1.5 inches."},
{c:"14",q:"Two-rescuer infant and child CPR ratio:",o:["15:2","30:2","5:1","10:2"],e:"Single rescuer: 30:2 for infants and children too."},
{c:"14",q:"Where should you check for a pulse in an unresponsive child?",o:["Carotid or femoral","Radial","Brachial only","Dorsalis pedis"],e:"Infants: brachial."},
{c:"14",q:"An infant has a pulse of 50 with poor perfusion despite good ventilation. You should:",o:["Start chest compressions","Keep ventilating only","Wait for the heart rate to rise","Give oxygen by blow-by only"],e:"In infants and children, a heart rate under 60 with signs of poor perfusion needs CPR."},
{c:"14",q:"Once an advanced airway is in place during CPR, ventilate at:",o:["1 breath every 6 seconds while compressions continue","2 breaths after every 30 compressions","1 breath every 2 seconds","1 breath per minute"],e:"Compressions no longer pause for breaths."},
{c:"14",q:"For a 5-year-old in cardiac arrest, pediatric AED pads aren’t available. You should:",o:["Use adult pads, making sure they don’t touch (front and back if needed)","Skip the AED","Cut the adult pads in half","Wait for paramedics"],e:"Pediatric pads or a dose attenuator are preferred for children under 8 when available."},
{c:"14",q:"The patient has a medication patch where an AED pad should go. You should:",o:["Remove the patch and wipe the skin before placing the pad","Place the pad over the patch","Skip that pad","Not use the AED"],e:"Also: dry a wet chest, and don’t place pads directly over an implanted device."},
{c:"14",q:"A patient in cardiac arrest has a bulge under the skin of the upper left chest. You should:",o:["Place the AED pad so it isn’t directly over the device","Not use the AED","Put the pad right on top of it","Remove the device"],e:"That’s likely a pacemaker or implanted defibrillator."},
{c:"14",q:"Which is NOT a reason to stop CPR?",o:["Fifteen minutes have passed","Return of spontaneous circulation","Care is transferred to equal or higher-level providers","A valid DNR is presented"],e:"Other reasons: you’re too exhausted to continue, the scene becomes unsafe, or a physician orders it."},
{c:"14",q:"A choking adult becomes unresponsive. You should:",o:["Start CPR, and look in the mouth before giving breaths","Keep doing abdominal thrusts standing","Do blind finger sweeps","Leave to get help first"],e:"Remove an object only if you can see it."},
{c:"14",q:"How do you relieve a severe airway obstruction in a responsive infant?",o:["Back slaps and chest thrusts","Abdominal thrusts","Blind finger sweeps","Holding the infant upside down and shaking"],e:"Abdominal thrusts are not used on infants."},
{c:"14",q:"A choking patient is in late pregnancy. You should use:",o:["Chest thrusts","Abdominal thrusts","Back slaps only","Nothing until she’s unresponsive"],e:"Chest thrusts are also used for patients too large to reach around."},
{c:"14",q:"A person with a partial airway obstruction can cough forcefully and speak. You should:",o:["Encourage them to keep coughing and watch closely","Start abdominal thrusts","Do a finger sweep","Start CPR"],e:"Step in if the cough becomes weak, they can’t speak, or they turn cyanotic."},
{c:"14",q:"Which link in the chain of survival most improves outcomes after early CPR in VF arrest?",o:["Rapid defibrillation","Waiting for advanced life support","Transport before shocking","Rescue breaths alone"],e:"Every minute without defibrillation in VF lowers survival."},
{c:"14",q:"After ROSC, you should:",o:["Support airway and breathing, keep the AED attached, and transport","Remove the AED pads","Let the patient walk","Stop monitoring"],e:"Patients can re-arrest, so keep reassessing."},
{c:"14",q:"If the AED says “no shock advised,” you should:",o:["Resume CPR right away, starting with compressions","Turn off the AED","Wait 2 minutes before doing anything","Check pupils"],e:"Re-analyze after 2 more minutes of CPR."},

{c:"15",q:"For an unresponsive medical patient, after the primary assessment you should:",o:["Do a rapid full-body exam, get vitals, and gather history from bystanders","Do a focused exam of one area","Only ask the patient SAMPLE questions","Skip vitals until arrival"],e:"Unresponsive patients can’t give you history, so the exam comes first."},
{c:"15",q:"A pandemic is:",o:["An outbreak spreading across countries worldwide","A local outbreak","A single case of illness","A noncontagious disease"],e:"An epidemic is a larger-than-expected outbreak in a region."},
{c:"15",q:"Sickle cell crisis falls under which category of medical emergency?",o:["Hematologic","Endocrine","Neurologic","Urologic"],e:"Hematologic emergencies involve the blood. Kidney stones would be urologic."},
{c:"15",q:"An EMT’s conclusion about what’s likely wrong is called a:",o:["Field impression","Final diagnosis","Differential prognosis","Medical order"],e:"It guides treatment and transport but can change as you learn more."},
{c:"15",q:"Why does destination matter for medical patients?",o:["Some conditions (like stroke or heart attack) need specialty centers","All hospitals offer identical care","The closest hospital is always required","Patients can’t choose"],e:"Follow protocol for specialty centers and patient preference when appropriate."},
{c:"15",q:"Which patient shows possible signs of sepsis?",o:["Fever, rapid heart rate, rapid breathing, and new confusion","Low-grade fever only","Sneezing and a runny nose","Mild sore throat with normal vitals"],e:"Report suspected sepsis early to the receiving hospital."},

{c:"16",q:"A patient with severe asthma suddenly has very quiet breath sounds and is drowsy. This suggests:",o:["Little air movement and impending respiratory failure","The attack is ending","Normal recovery","Upper airway obstruction"],e:"A “silent chest” is an ominous sign. Prepare to ventilate."},
{c:"16",q:"Pursed-lip breathing and a barrel chest are typical of:",o:["COPD","Croup","Pulmonary embolism","Hyperventilation"],e:"Pursed lips help keep small airways open during exhalation."},
{c:"16",q:"Fever, productive cough, and crackles in one area of the lung suggest:",o:["Pneumonia","Asthma","Croup","Spontaneous pneumothorax"],e:"Pneumonia is a lung infection. Older adults may show only confusion or weakness."},
{c:"16",q:"Sudden shortness of breath and sharp chest pain after a long flight suggest:",o:["Pulmonary embolism","Asthma","Croup","Bronchitis"],e:"Other risk factors: recent surgery, immobility, birth control pills, smoking."},
{c:"16",q:"A tall, thin young man has sudden sharp chest pain and decreased breath sounds on one side. Most likely?",o:["Spontaneous pneumothorax","Pneumonia","Asthma","Myocardial infarction"],e:"A weak spot in the lung ruptures and air collects in the chest."},
{c:"16",q:"An anxious patient breathes rapidly with tingling fingers and spasms in the hands. Best approach?",o:["Calm them, coach slower breathing, and rule out serious causes","Have them breathe into a paper bag","Ignore it","Use a BVM"],e:"Rapid breathing can come from serious conditions, so don’t assume it’s anxiety."},
{c:"16",q:"A barking, seal-like cough with stridor in a toddler suggests:",o:["Croup","Epiglottitis","Asthma","Pertussis"],e:"Croup is usually viral with gradual onset, often at night."},
{c:"16",q:"A child with sudden high fever, drooling, and tripod positioning may have epiglottitis. You should NOT:",o:["Look in the throat or place anything in the mouth","Keep the child calm","Let the child stay with the parent","Give oxygen as tolerated"],e:"Agitation can trigger complete airway obstruction."},
{c:"16",q:"Coughing fits ending in a high-pitched “whoop” suggest:",o:["Pertussis","Croup","Asthma","COPD"],e:"Pertussis (whooping cough) is very contagious. Wear a mask."},
{c:"16",q:"Rhonchi are:",o:["Coarse, rattling sounds from mucus in larger airways","High-pitched inspiratory sounds","Fine popping at the lung bases","Absent breath sounds"],e:"Common with bronchitis and pneumonia."},
{c:"16",q:"A patient sitting upright, leaning forward with hands on knees, is in the:",o:["Tripod position","Recovery position","Fowler’s position","Trendelenburg position"],e:"A classic sign of respiratory distress."},
{c:"16",q:"An infant with wheezing, runny nose, and difficulty feeding during winter most likely has:",o:["RSV bronchiolitis","Epiglottitis","Spontaneous pneumothorax","Pulmonary embolism"],e:"RSV is very contagious and a common cause of lower respiratory infection in infants."},
{c:"16",q:"Before helping with a patient’s inhaler, confirm:",o:["Signs of respiratory distress, the inhaler is theirs, and protocol or medical control allows it","Only that the patient asked","That it has been used before","That the patient is unresponsive"],e:"Also check that the maximum dose hasn’t already been taken and it isn’t expired."},

{c:"17",q:"Which is the heart’s electrical conduction pathway?",o:["SA node → AV node → bundle of His → Purkinje fibers","AV node → SA node → Purkinje fibers → bundle of His","Purkinje fibers → bundle of His → AV node → SA node","SA node → Purkinje fibers → AV node"],e:"The AV node briefly delays the impulse so the ventricles can fill."},
{c:"17",q:"Atherosclerosis is:",o:["Buildup of fatty plaque inside arteries","Inflammation of the heart lining","An irregular heartbeat","A weakened heart valve"],e:"Plaque can rupture and trigger a clot, causing ACS."},
{c:"17",q:"Which is a controllable risk factor for heart disease?",o:["Smoking","Age","Family history","Sex"],e:"Others: high blood pressure, high cholesterol, diabetes, obesity, inactivity."},
{c:"17",q:"Stable angina is typically relieved by:",o:["Rest or nitroglycerin","Eating a meal","Lying flat","Coughing"],e:"Pain that persists despite rest and nitro raises concern for MI."},
{c:"17",q:"The most common initial rhythm in adult sudden cardiac arrest is:",o:["Ventricular fibrillation","Asystole","Normal sinus rhythm","Sinus bradycardia"],e:"VF is shockable, which is why early AED use matters."},
{c:"17",q:"Which rhythms can an AED shock?",o:["Ventricular fibrillation and pulseless ventricular tachycardia","Asystole","Normal sinus rhythm","Any rhythm with a pulse"],e:"Asystole (flatline) is not shockable."},
{c:"17",q:"Left-sided heart failure commonly causes:",o:["Fluid backing up into the lungs (pulmonary edema)","Swollen ankles first","Fever","Hives"],e:"Right-sided failure causes JVD and swelling in the legs and abdomen."},
{c:"17",q:"Sudden tearing chest pain radiating to the back, with different BP in each arm, suggests:",o:["Aortic dissection","Stable angina","Pneumonia","Asthma"],e:"Treat as a life-threatening emergency and transport rapidly."},
{c:"17",q:"A patient with a left ventricular assist device (LVAD) may:",o:["Not have a palpable pulse","Always have a high BP","Not need transport","Never need CPR"],e:"Assess perfusion through mental status, skin, and breathing. Bring the device equipment and caregivers if possible."},
{c:"17",q:"A patient sleeps sitting up on three pillows because lying flat makes breathing harder. This is:",o:["Orthopnea, suggesting heart failure","Normal in all adults","A sign of asthma only","Hyperventilation"],e:"Orthopnea is a classic heart failure clue."},
{c:"17",q:"After assisting with one dose of nitroglycerin, before another dose you should first:",o:["Recheck the blood pressure and reassess","Give the next dose immediately","Lay the patient flat","Give aspirin again"],e:"Many protocols allow repeat doses about every 5 minutes, up to 3 total, if BP stays adequate. Follow yours."},
{c:"17",q:"Severe headache, confusion, and a very high BP suggest:",o:["Hypertensive emergency","Hypoglycemia","Septic shock","Angina"],e:"Can lead to stroke. Transport promptly and reassess."},
{c:"17",q:"A patient’s implanted defibrillator delivers a shock while you’re touching them. This means:",o:["The shock is low energy and generally not dangerous to you","You will be seriously injured","The AED is no longer needed","The patient doesn’t need transport"],e:"An ICD firing suggests a dangerous rhythm. Assess and transport."},
{c:"17",q:"Atypical heart attack signs in women may include:",o:["Fatigue, indigestion, jaw or back pain, and shortness of breath","Only crushing chest pain","Fever and rash","Itching"],e:"Have a high index of suspicion in women, older adults, and people with diabetes."},

{c:"S",s:"D",q:"What is the most likely cause?",o:["Croup","Epiglottitis","Asthma","Foreign body in the esophagus"],e:"Barking cough, inspiratory stridor, low fever, gradual onset at night: classic croup."},
{c:"S",s:"D",q:"Which approach is best?",o:["Keep him calm in his mother’s lap and give humidified or blow-by oxygen as indicated","Lay him flat on the stretcher alone","Look in his throat with a tongue depressor","Have him breathe into a paper bag"],e:"Agitation worsens airway narrowing. Keep the child comfortable and calm."},
{c:"S",s:"D",q:"Which change shows he’s getting worse?",o:["He becomes drowsy with retractions and quieter breathing","He’s crying loudly","He asks for a drink","His cough sounds the same"],e:"Fatigue and a falling level of consciousness signal respiratory failure."},
{c:"S",s:"D",q:"If he deteriorates and breathing becomes inadequate, you should:",o:["Assist ventilations with an appropriately sized BVM","Keep using blow-by oxygen only","Wait for him to improve","Give an oral medication"],e:"Size equipment for the child and give breaths just enough to make the chest rise."},

      if(fb){cls+=i===q.ans?' right':i===q.pick?' wrong':' dim';}
      else if(i===q.pick) cls+=' sel';
      return `<button type="button" class="${cls}" data-act="pick" data-i="${i}" ${fb?'disabled':''} aria-pressed="${i===q.pick}"><span class="let">${'ABCD'[i]}</span><span class="txt">${esc(t)}</span></button>`;
    }).join('');
    const ok=q.pick===q.ans;
    const feedback=fb?`<div class="fb ${ok?'ok':'no'}"><p class="verdict">${ok?'Correct.':`The answer is ${'ABCD'[q.ans]}.`}</p><p>${esc(q.e)}</p></div>`:'';
    $app.innerHTML=`${head()}<p class="chap">${esc(CH[q.c])}</p>${stem}<h2 class="q">${esc(q.q)}</h2><div class="opts">${opts}</div><div aria-live="polite">${feedback}</div>
    <div class="dock">${answered?`<button type="button" class="primary" data-act="next">${last?'See results':'Next question'}</button>`:`<p class="dock-hint">${run.instant?'Tap an answer':'Tap an answer. You can change it before moving on.'}</p>`}</div>`;
  } else {
    $app.innerHTML=`${head()}<p class="chap">${esc(CH[q.c])}</p><h2 class="q">${esc(q.q)}</h2>
    ${q.revealed?`<div class="answer" aria-live="polite"><p class="ans-h">Key points</p><p>${esc(q.a)}</p></div>`:`<p class="help">Say or write your answer first.</p>`}
    <div class="dock">${q.revealed?`<div class="two"><button type="button" class="grade miss" data-act="miss">Missed it</button><button type="button" class="grade got" data-act="got">Got it</button></div>`:`<button type="button" class="primary" data-act="reveal">Show answer</button>`}</div>`;
  }
}

function okItem(it){return run.mode==='mcq'?it.pick===it.ans:it.got===true;}
function doneItem(it){return run.mode==='mcq'?it.pick!==null:it.got!==null;}

function finish(){
  const done=run.items.filter(doneItem);
  if(!done.length){renderHome();return;}
  done.forEach(it=>{const s=store.stats[it.c]||(store.stats[it.c]={seen:0,correct:0});s.seen++;if(okItem(it))s.correct++;});
  save();
  run.done=done;run.missed=done.filter(it=>!okItem(it));
  renderResults();
}

function renderResults(){
  const total=run.done.length,right=total-run.missed.length,p=right/total,t=tri(p);
  const by={};run.done.forEach(it=>{const b=by[it.c]||(by[it.c]={n:0,r:0});b.n++;if(okItem(it))b.r++;});
  const rows=ORDER.filter(k=>by[k]).map(k=>({k,...by[k],p:by[k].r/by[k].n})).sort((a,b)=>a.p-b.p);
  const tags=rows.map(r=>{const tt=tri(r.p);return `<li class="mtag ${tt.cls}"><span class="mhole" aria-hidden="true"></span><span class="mname">${esc(CH[r.k])}</span><span class="mscore">${r.r}/${r.n}</span><span class="sr">${tt.word}</span></li>`;}).join('');
  const missed=run.missed.map(it=>{
    if(run.mode==='mcq'){
      return `<li class="miss-item"><p class="mchap">${esc(CH[it.c])}${it.s?`, scenario ${it.s}`:''}</p><p class="mq">${esc(it.q)}</p>
      <p class="yours">You picked: ${esc(it.opts[it.pick])}</p><p class="correct">Answer: ${esc(it.opts[it.ans])}</p><p class="why">${esc(it.e)}</p></li>`;
    }
    return `<li class="miss-item"><p class="mchap">${esc(CH[it.c])}</p><p class="mq">${esc(it.q)}</p><p class="correct">${esc(it.a)}</p></li>`;
  }).join('');
  $app.innerHTML=`
  <div class="tag ${t.cls}">
    <span class="hole" aria-hidden="true"></span>
    <p class="tag-word">${t.word}</p>
    <p class="tag-score">${Math.round(p*100)}%</p>
    <p class="tag-note">${right} of ${total} correct. ${t.note}</p>
  </div>
  ${rows.length>1?`<section class="block"><h2>By chapter</h2><ul class="mtags">${tags}</ul></section>`:''}
  ${run.missed.length?`<section class="block"><h2>Review what you missed</h2><ol class="missed">${missed}</ol></section>`:`<p class="clean">Nothing missed. Try a longer drill or switch format.</p>`}
  <div class="dock"><div class="two">
    <button type="button" class="ghost" data-act="home">New drill</button>
    ${run.missed.length?`<button type="button" class="primary" data-act="retry">Retry ${run.missed.length} missed</button>`:`<button type="button" class="primary" data-act="again">Go again</button>`}
  </div></div>`;
  window.scrollTo(0,0);
}

$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a!=='reset') resetArmed=false;
  switch(a){
    case 'set':{const k=b.dataset.k;let v=b.dataset.v;if(k==='count')v=v==='all'?'all':+v;if(k==='instant')v=v==='1';S[k]=v;savePrefs();renderHome();break;}
    case 'chip':{const c=b.dataset.c;S.chs.has(c)?S.chs.delete(c):S.chs.add(c);savePrefs();renderHome();break;}
    case 'all':S.chs=new Set(ORDER);savePrefs();renderHome();break;
    case 'none':S.chs=new Set();savePrefs();renderHome();break;
    case 'weak':{S.mode='mcq';S.chs=new Set(ORDER.filter(k=>{const s=store.stats[k];return s&&s.seen>=4&&s.correct/s.seen<0.7;}));S.count='all';savePrefs();start(buildPool());window.scrollTo(0,0);break;}
    case 'reset':if(resetArmed){store.stats={};save();resetArmed=false;}else{resetArmed=true;}renderHome();break;
    case 'start':start(buildPool());window.scrollTo(0,0);break;
    case 'pick':{const q=run.items[run.i];if(run.instant&&q.pick!==null)return;q.pick=+b.dataset.i;renderQ();break;}
    case 'next':run.i++;if(run.i>=run.items.length)finish();else{renderQ();window.scrollTo(0,0);}break;
    case 'reveal':run.items[run.i].revealed=true;renderQ();break;
    case 'got':case 'miss':run.items[run.i].got=(a==='got');run.i++;if(run.i>=run.items.length)finish();else{renderQ();window.scrollTo(0,0);}break;
    case 'quit':finish();break;
    case 'retry':{const m=run.mode,inst=run.instant;const items=shuffle(run.missed).map(it=>m==='mcq'?prepMcq(it):prepCard(it));run={mode:m,instant:inst,items,i:0};renderQ();window.scrollTo(0,0);break;}
    case 'again':start(buildPool());window.scrollTo(0,0);break;
    case 'home':renderHome();window.scrollTo(0,0);break;
  }
});

document.addEventListener('keydown',e=>{
  if(!run||e.metaKey||e.ctrlKey||e.altKey)return;
  const q=run.items[run.i];if(!q)return;
  if(run.mode==='mcq'&&/^[1-4a-dA-D]$/.test(e.key)){
    const i=/\d/.test(e.key)?+e.key-1:'abcd'.indexOf(e.key.toLowerCase());
    const btn=$app.querySelector(`[data-act="pick"][data-i="${i}"]`);if(btn&&!btn.disabled)btn.click();
  } else if(e.key==='Enter'){
    const btn=$app.querySelector('[data-act="next"],[data-act="reveal"]');if(btn&&document.activeElement===document.body)btn.click();
  }
});

renderHome();
})();

</script>
</body>
</html>
